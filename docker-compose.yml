# Local development stack (docs/specs/spec-004-local-dev-env.md).
# Backend and frontend run on the host for fast reload; this provides Postgres + MQTT.
#
#   docker compose up -d          # start
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop and wipe the database
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: people_counter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d people_counter"]
      interval: 2s
      timeout: 3s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
